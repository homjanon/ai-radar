name: probe-sources

# AI 前沿雷达 · 源可用性探测 —— 只读，不写任何文件、不提交、不碰 docs/。
#
# 定位与 news-feed 的 probe-models.yml 相同：换源/加源之前先验证「源还活着吗、
# 哪个实例最稳、desc 深浅如何」，避免改完 sources.json 才发现静默断流。
#
# 为什么必须在 Actions 上跑（而不是本机）：
#   本机经代理的实测结果不可信 —— 实测中 19 个源报 `Tunnel connection failed: 502`，
#   但其中 news.google.com 在 news-feed 生产环境稳定可用。Actions 走直连（美国 IP），
#   才是真实基线。
on:
  workflow_dispatch:
  schedule:
    # 每月 1 号 11:00 北京（03:00 UTC）：定期体检，及时发现失效源
    - cron: '0 3 1 * *'

permissions:
  contents: read

concurrency:
  group: probe-sources
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 探测源可用性（全源 · 全通路）
        run: python scripts/probe_sources.py

      # 配置摘要（车道/源清单/模型链/案例库）由 probe_sources.py 自己打印 —— 不在这里
      # 另写一份：摘要必须与探测结果同源，否则「配置里有什么」会与「实测到什么」对不上。
