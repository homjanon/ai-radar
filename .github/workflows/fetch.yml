name: fetch-ai

# AI 前沿雷达 · 抓取与发布
#
# 每天一次早报：北京 07:30（UTC 前一天 23:30）
#   ① 为什么是早报：美国实验室多在美东/美西上午发模型，换算成北京是深夜到清晨，
#      早上跑正好一网打尽前一天的发布。
#   ② 为什么是 07:30 而不是 08:10：**GitHub 的 schedule 要排共享队列、实测经常延迟**
#      （多次遇到延后十几到几十分钟）。往前留一档，才能保证 08:00 前拿到产物。
#   ③ 为什么不走 Cloudflare 定时触发（与 news-feed 的做法不同）：本情报对分钟级精度
#      没有要求（news-feed 的 15:20 有盘中含义，所以那边必须精确）。少一个外部依赖
#      和一次 token 轮转，就少一处会坏的地方。
#   ④ 外部触发（备用，需要时再启）：POST
#      /repos/homjanon/ai-radar/actions/workflows/fetch.yml/dispatches
#      body {"ref":"main"} —— 本 workflow **没有 inputs**，漏传 ref 会 422。
#      ⚠️ 一旦启用外部触发，务必同时删掉下方 schedule：两边各跑一次而 concurrency
#      只排队不合并，会导致 LLM 免费额度翻倍消耗、产物提交两次。
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: fetch-ai
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 离线冒烟测试（抓取前的守门）
        # 为什么要有这一步：py_compile 只查语法，查不出 NameError。实测踩过 ——
        # 同一文件的多条并行编辑互相覆盖，`lib_items = []` 的初始化丢了而引用还在，
        # 本地「语法通过」，线上正式抓取直接 NameError 崩掉、当天没有产物。
        # smoke_test.py 用预置数据把 main() 全流程跑一遍（不联网、不需要 Secret）。
        run: python scripts/smoke_test.py

      - name: 抓取并生成 JSON
        env:
          # P2 LLM 增强用。未配置时自动跳过该模型并降级为原文，不影响抓取主流程。
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python scripts/fetch_ai.py --outdir docs

      - name: 清理超过 30 天的归档
        run: |
          mkdir -p docs/daily docs/data/reports
          find docs/daily -name '*.json' -mtime +30 -delete
          find docs/data/reports -name '*.json' -mtime +30 -delete

      - name: 提交发布
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "ai-radar: $(TZ=Asia/Shanghai date +%F)"
            # 必须 rebase 后再推：抓取期间可能有人（或另一个 workflow）往 main 推了东西，
            # 直接 push 会被拒（实测踩过：与本地的 .gitignore 提交撞车导致整次运行失败）
            git pull --rebase --autostash origin main
            git push
          fi
