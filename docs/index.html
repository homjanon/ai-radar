<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>AI 前沿雷达 · ai-radar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230f766e'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23fbf8f2' font-family='monospace'>&gt;_</text></svg>">
<style>
/* ════════════════════════════════════════════════════════════════════
   AI 前沿雷达 · 极客终端主题
   两条硬约束（与抓取脚本的字段一一对应，改样式不要改字段名）：
   ① 所有外部文本必须经 esc() 转义后再插入 —— RSS/API 内容永不可信
      （借鉴 agent-pulse：外部文本永不当可信 HTML）
   ② 深色 + 等宽 + 霓虹强调；信息密度优先，动效克制
   ════════════════════════════════════════════════════════════════════ */
:root{
  /* ── 方案 4 · 米白终端 Paper ─────────────────────────────────────
     浅色底的「极客感」不靠霓虹，靠三样：等宽字体、纸感底色分层、细网格与 1px 描边。
     强调色用墨绿 —— 终端绿在浅底上的对应物（浅底放亮绿会糊成一片）。 */
  --bg:#e7e0d3;          /* 桌面（页面底） */
  --stage:#fcfaf5;       /* 窗口正文 */
  --stage-bot:#f4efe4;
  --panel:#f2eee4;       /* 窗口内条栏（顶栏/状态条/Tab/筛选） */
  --panel2:#ece6d9;
  --card:#f8f5ee;        /* 条目卡 / 案例卡 */
  --card-bot:#f1ece1;
  --line:#dcd3c1; --line2:#c9bfa9; --line3:#b3a68c;
  --fg:#2b2721; --fg2:#5b5346; --fg3:#6f6555; --fg4:#8a8071;
  --acc:#0f766e;         /* 主强调：墨绿 */
  --acc2:#1d4ed8;        /* 次强调：靛蓝 */
  --amber:#b45309; --red:#b91c1c;
  --l-model:#0369a1; --l-official:#6d28d9; --l-apps:#0f766e; --l-paper:#b45309;
  --l-community:#be185d; --l-media:#a16207; --l-cn:#b91c1c;
  /* 以下为深/浅两版差异最大的一组：深色靠「发光」,浅色必须换成「着色」 */
  --title:#26221c;
  --grid:rgba(80,64,42,.055);
  --scan:rgba(120,104,80,.05);
  --term-shadow:0 0 0 1px rgba(120,104,80,.16),0 20px 46px -32px rgba(60,48,30,.34);
  --card-shadow:0 1px 2px rgba(90,76,54,.07),0 6px 16px -14px rgba(60,48,30,.22);
  --hl-shadow:none;
  --tint-a:rgba(15,118,110,.08);
  --tint-b:rgba(15,118,110,.14);
  --acc-line:rgba(15,118,110,.34);
  --acc-link:rgba(15,118,110,.55);
  --acc2-line:rgba(29,78,216,.3);  --acc2-tint:rgba(29,78,216,.07);
  --red-line:rgba(185,28,28,.34);  --red-tint:rgba(185,28,28,.07);
  --amber-line:rgba(180,83,9,.32); --amber-tint:rgba(180,83,9,.07);
  --chip-bg:rgba(120,104,80,.05); --chip-bg-h:rgba(120,104,80,.11); --chip-line:#c2b69e;
  --mono:ui-monospace,"JetBrains Mono","Cascadia Mono","SF Mono",Menlo,Consolas,"Microsoft YaHei UI",monospace;
  --sans:"Microsoft YaHei UI","PingFang SC",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:14.5px;line-height:1.7;min-height:100vh;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
}
body::after{ /* 极轻扫描线，只做质感、不干扰阅读 */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px);
  opacity:.55;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 72px}

/* ── 终端窗框 ─────────────────────────────────────── */
.term{
  margin-top:20px;border:1px solid var(--line2);border-radius:10px;
  background:linear-gradient(180deg,var(--stage),var(--stage-bot) 62%);
  box-shadow:var(--term-shadow);
  overflow:hidden;
}
.tbar{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);background:var(--panel)}
.dots{display:flex;gap:6px;flex:0 0 auto}
.dots i{width:10px;height:10px;border-radius:50%;display:block;opacity:.85}
.dots i:nth-child(1){background:#ff5f56}.dots i:nth-child(2){background:#f5b544}.dots i:nth-child(3){background:#2ee6a8}
.path{font-family:var(--mono);font-size:11.5px;color:var(--fg3);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
.path b{color:var(--acc);font-weight:600}
.online{font-family:var(--mono);font-size:10.5px;color:var(--acc);letter-spacing:.14em;border:1px solid var(--acc-line);border-radius:3px;padding:2px 7px;background:var(--tint-a);flex:0 0 auto}
.online::before{content:"●";margin-right:5px;animation:blink 2.4s steps(1) infinite}
@keyframes blink{0%,62%{opacity:1}63%,100%{opacity:.22}}

/* ── 头部 ─────────────────────────────────────────── */
.head{padding:24px 26px 20px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:10.5px;color:var(--fg3);letter-spacing:.3em;text-transform:uppercase;margin-bottom:9px}
h1{margin:0 0 8px;font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.15;font-family:var(--mono)}
h1 .br{color:var(--fg4)}
h1 .hl{color:var(--acc);text-shadow:var(--hl-shadow)}
.prompt{font-family:var(--mono);font-size:12.5px;color:var(--fg2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.prompt .u{color:var(--acc)}
.cur{display:inline-block;width:8px;height:15px;background:var(--acc);vertical-align:-2px;animation:blink 1.06s steps(1) infinite}

/* ── 状态条（像系统监控面板）───────────────────────── */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.stat div{background:var(--panel);padding:11px 14px}
.stat .k{font-family:var(--mono);font-size:9.5px;color:var(--fg3);letter-spacing:.15em;text-transform:uppercase;margin-bottom:3px;white-space:nowrap}
.stat .v{font-family:var(--mono);font-size:14.5px;color:var(--fg);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.35}
.stat .v.sm{font-size:11.5px;line-height:1.45}
.stat .v.nowrap{white-space:nowrap;font-size:13px}
.stat .v.g{color:var(--acc)}.stat .v.a{color:var(--amber)}.stat .v.r{color:var(--red)}

/* ── Tab ──────────────────────────────────────────── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--mono);font-size:12.5px;color:var(--fg3);cursor:pointer;padding:12px 18px;border:0;background:none;white-space:nowrap;border-right:1px solid var(--line);border-bottom:2px solid transparent;transition:color .16s,background .16s;letter-spacing:.02em}
.tab:hover{color:var(--fg);background:var(--panel2)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--tint-a);text-shadow:var(--hl-shadow)}
.tab .n{font-size:10.5px;color:var(--fg3);margin-left:6px;border:1px solid var(--line2);border-radius:3px;padding:0 4px}
.tab.on .n{color:var(--acc);border-color:var(--acc-line)}

/* ── 工具行 / 筛选 ─────────────────────────────────── */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar .lbl{font-family:var(--mono);font-size:10px;color:var(--fg3);letter-spacing:.18em;text-transform:uppercase;flex:0 0 auto}
.chip{font-family:var(--mono);font-size:11.5px;cursor:pointer;user-select:none;color:var(--fg2);background:var(--chip-bg);border:1px solid var(--chip-line);border-radius:3px;padding:3px 10px;transition:.15s;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--line3);background:var(--chip-bg-h)}
.chip.on{color:var(--bg);background:var(--acc);border-color:var(--acc);font-weight:600}
.chip .c{opacity:.62;margin-left:5px;font-size:10.5px}
.dot{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:0}
.search{font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:5px 10px;outline:none;flex:1 1 190px;min-width:120px}
.search:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--tint-b)}
.search::placeholder{color:var(--fg4)}

/* ── 分组 ──────────────────────────────────────────── */
.grp{padding:24px 18px 0}
.grp .h{display:flex;align-items:center;gap:10px;margin-bottom:13px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.grp .h .t{font-weight:700}
.grp .h .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.grp .h .cnt{color:var(--fg3);font-size:11px;letter-spacing:0}
.h-top .t{color:var(--red);text-shadow:var(--hl-shadow)}
.h-watch .t{color:var(--amber)}
.h-normal .t{color:var(--fg3)}
.h-lib .t{color:var(--acc2)}

/* ── 条目 ──────────────────────────────────────────── */
.list{display:flex;flex-direction:column;gap:8px}
.it{position:relative;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,var(--card),var(--card-bot));box-shadow:var(--card-shadow);padding:13px 15px 13px 16px;transition:border-color .16s,transform .16s}
.it:hover{border-color:var(--line3);transform:translateX(2px)}
.it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--lane,var(--line2))}
.it.top{border-color:var(--red-line);background:linear-gradient(180deg,var(--red-tint),transparent 72%)}
.it.top::before{background:var(--red)}
.it.watch::before{background:var(--amber)}
.it.rep{opacity:.52}
.it.rep:hover{opacity:.82}
.it .t1{font-size:15px;font-weight:600;color:var(--title);line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.it .t1 .mk{font-family:var(--mono);color:var(--fg4);flex:0 0 auto;font-size:12px;line-height:1.75}
.it.top .t1 .mk{color:var(--red)}
.it .t1 a{color:inherit;text-decoration:none}
.it .t1 a:hover{color:var(--acc);text-decoration:underline;text-decoration-color:var(--acc-link)}
.it .t1 .en{display:block;font-family:var(--mono);font-size:10.5px;color:var(--fg3);font-weight:400;margin-top:3px;line-height:1.5;word-break:break-word}
.it .sm{margin:7px 0 0;color:var(--fg2);font-size:13.2px;line-height:1.72}
.it .sm2{margin:6px 0 0;color:var(--fg3);font-size:12.4px;line-height:1.68}
.it .meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:9px;font-family:var(--mono);font-size:10.5px;color:var(--fg3)}
.it .meta .tg{border:1px solid var(--line2);border-radius:3px;padding:1px 6px;display:inline-flex;align-items:center;gap:5px}
.it .meta .lv{font-weight:700;letter-spacing:.06em}
.it .meta .lv.top{color:var(--red);border-color:var(--red-line);background:var(--red-tint)}
.it .meta .lv.watch{color:var(--amber);border-color:var(--amber-line);background:var(--amber-tint)}
.it .meta .sc{color:var(--fg4)}
.it .meta .sc b{color:var(--fg2);font-weight:600}
.it .meta .tp{color:var(--acc2);border-color:var(--acc2-line);background:var(--acc2-tint)}
.it .meta .at{color:var(--acc);border-color:var(--acc-line);background:var(--tint-a)}
.it .meta .sta{color:var(--fg4)}

details.more{border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-top:4px}
details.more>summary{cursor:pointer;list-style:none;padding:11px 14px;font-family:var(--mono);font-size:11.5px;color:var(--fg3);letter-spacing:.08em}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary:hover{color:var(--fg)}
details.more>summary::before{content:"▸ ";color:var(--acc)}
details.more[open]>summary::before{content:"▾ "}
details.more>summary::after{content:"  [ 展开 / 收起 ]";font-size:9.5px;color:var(--fg4);letter-spacing:.1em}
details.more .list{padding:0 10px 12px}

/* ── 案例库 ───────────────────────────────────────── */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(278px,1fr));gap:11px;padding:18px 18px 0}
.case{position:relative;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,var(--card),var(--card-bot));box-shadow:var(--card-shadow);padding:14px 15px;display:flex;flex-direction:column;gap:7px;transition:border-color .16s,box-shadow .16s,transform .16s}
.case:hover{border-color:var(--acc-line);transform:translateY(-2px);box-shadow:0 14px 28px -20px rgba(60,48,30,.42)}
.case .ct{font-size:14px;font-weight:600;color:var(--title);line-height:1.5}
.case .ct a{color:inherit;text-decoration:none}
.case .ct a:hover{color:var(--acc)}
.case .cen{font-family:var(--mono);font-size:10px;color:var(--fg4);line-height:1.45;word-break:break-word}
.case .cs{color:var(--fg2);font-size:12.6px;line-height:1.7;flex:1}
.case .cf{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--fg3);border-top:1px dashed var(--line2);padding-top:8px}
.case .cf .ty{color:var(--acc);border:1px solid var(--acc-line);border-radius:3px;padding:0 5px}
.case .cf .ty.none{color:var(--fg3);border-color:var(--line2)}

.empty{padding:44px 18px;text-align:center;font-family:var(--mono);color:var(--fg3);font-size:12.5px;line-height:2}
.empty .b{color:var(--fg4);font-size:26px;display:block;margin-bottom:10px}

.ft{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--fg4);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hide{display:none!important}

@media(max-width:640px){
  .wrap{padding:0 11px 56px}
  .head{padding:18px 16px 16px}
  h1{font-size:22px}
  .stat{grid-template-columns:repeat(2,1fr)}
  .cases{grid-template-columns:1fr;padding:14px 12px 0}
  .grp{padding:16px 12px 0}
  .bar{padding:10px 12px}
  .tab{padding:11px 13px;font-size:12px}
  .it{padding:11px 12px 11px 13px}
  .it .t1{font-size:13.6px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="term">
    <div class="tbar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="path">~/ai-radar <b>$</b> tail -n 100 briefing.log</div>
      <div class="online" id="live">ONLINE</div>
    </div>

    <div class="head">
      <div class="eyebrow">LLM · Agent · Skill — 前沿情报管道</div>
      <h1><span class="br">[</span> <span class="hl">AI 前沿雷达</span> <span class="br">]</span></h1>
      <div class="prompt">
        <span><span class="u">ai-radar</span>@homjanon:~$ ./fetch --brief</span>
        <span class="cur"></span>
      </div>
    </div>

    <div class="stat" id="stat"></div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="view-brief"></div>
  <div id="view-cases" class="hide"></div>

  <div class="ft">
    <span>ai-radar · 源基线由 Actions 侧探测确认 · 选条走硬规则、表达由 LLM</span>
    <span id="ft-gen">—</span>
  </div>
</div>

<script>
/* ── 工具 ─────────────────────────────────────────── */
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
};
var attr = function(s){ return esc(s).replace(/`/g,'&#96;'); };

var LANE = {
  model:'#22d3ee', official:'#5b9dff', apps:'#2ee6a8', paper:'#a78bfa',
  community:'#f472b6', media:'#f5b544', cn:'#fb7185'
};
var LV = { top:'重磅', watch:'关注', normal:'常规' };

function ageLabel(h){
  if (h == null || h < 0) return '';
  if (h < 1) return '刚刚';
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}
function host(u){ try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return ''; } }

/* ── 状态条 ───────────────────────────────────────── */
function renderStat(d, casesN){
  var L = (d.counts && d.counts.byLevel) || {};
  var deg = (d.degraded || []).length;
  var modelTxt = String(d.translator || '—');
  var rows = [
    ['generated', esc(d.generated_at || '—'), 'nowrap'],
    ['items', esc((d.counts && d.counts.total) || 0), 'g'],
    ['heavy/watch', (L.top || 0) + ' / ' + (L.watch || 0), 'a'],
    ['lanes', (d.lanes || []).length, ''],
    ['repeat', esc((d.counts && d.counts.repeat) || 0), ''],
    ['cases', casesN == null ? '…' : casesN, ''],
    ['model', esc(modelTxt), modelTxt.length > 20 ? 'sm' : ''],
    ['degraded', deg, deg ? 'r' : 'g']
  ];
  $('#stat').innerHTML = rows.map(function(r){
    return '<div><div class="k">' + r[0] + '</div><div class="v ' + r[2] + '">' + r[1] + '</div></div>';
  }).join('');
}

/* ── 条目 ─────────────────────────────────────────── */
function itemHTML(i){
  var col = LANE[i.lane] || 'var(--line2)';
  var title = i.titleCn || i.title || '';
  var altEn = (i.titleCn && i.title) ? i.title : '';
  var href = i.url || '#';
  var sc = i.score ? (i.score.rel + '/' + i.score.info + '/' + i.score.fresh) : '';
  var mk = i.level === 'top' ? '▲' : (i.level === 'watch' ? '▸' : '·');
  var meta = [];
  meta.push('<span class="tg"><span class="dot" style="background:' + col + '"></span>' +
            esc(i.lane) + ' · ' + esc(i.block || i.source || '') + '</span>');
  if (LV[i.level]) meta.push('<span class="tg lv ' + esc(i.level) + '">' + LV[i.level] + '</span>');
  if (i.total != null) meta.push('<span class="sc">score <b>' + esc(i.total) + '</b>' +
            (sc ? ' <span style="opacity:.6">' + esc(sc) + '</span>' : '') + '</span>');
  if (i.apptype) meta.push('<span class="tg at">' + esc(i.apptype) + '</span>');
  if (i.topic) meta.push('<span class="tg tp">' + esc(i.topic) + '</span>');
  var t = i.pubTime || (i.ageH >= 0 ? ageLabel(i.ageH) : '');
  if (t) meta.push('<span class="sta">' + esc(t) + '</span>');
  if (i.stale) meta.push('<span class="sta">较早</span>');
  if (i.isRepeat) meta.push('<span class="sta">昨日已收录</span>');
  if ((i.alsoIn || []).length) meta.push('<span class="sta">另 ' + i.alsoIn.length + ' 源</span>');
  if (i.descFrom) meta.push('<span class="sta">正文已补抓</span>');

  var desc = (i.desc && i.desc !== i.summary) ? String(i.desc) : '';
  return '<article class="it ' + esc(i.level || '') + (i.isRepeat ? ' rep' : '') + '" style="--lane:' + col + '">' +
    '<div class="t1"><span class="mk">' + mk + '</span><span style="min-width:0">' +
      '<a href="' + attr(href) + '" target="_blank" rel="noopener noreferrer">' + esc(title) + '</a>' +
      (altEn ? '<span class="en">' + esc(altEn) + '</span>' : '') +
    '</span></div>' +
    (i.summary ? '<p class="sm">' + esc(i.summary) + '</p>' : '') +
    (desc ? '<p class="sm2">' + esc(desc.slice(0, 220)) + (desc.length > 220 ? '…' : '') + '</p>' : '') +
    '<div class="meta">' + meta.join('') + '</div>' +
  '</article>';
}

/* ── 简报 ─────────────────────────────────────────── */
var DATA = null, laneFilter = 'all';

function renderBrief(){
  var d = DATA, items = d.items || [], lanes = d.lanes || [];
  var pick = items.filter(function(i){ return laneFilter === 'all' || i.lane === laneFilter; });
  var top = pick.filter(function(i){ return i.level === 'top'; });
  var watch = pick.filter(function(i){ return i.level === 'watch'; });
  var normal = pick.filter(function(i){ return i.level === 'normal' && !i.isRepeat; });
  var rep = pick.filter(function(i){ return i.isRepeat; });

  var chips = ['<button class="chip' + (laneFilter === 'all' ? ' on' : '') +
    '" data-lane="all">全部<span class="c">' + items.length + '</span></button>'];
  lanes.forEach(function(l){
    var n = items.filter(function(i){ return i.lane === l.id; }).length;
    if (!n) return;
    chips.push('<button class="chip' + (laneFilter === l.id ? ' on' : '') + '" data-lane="' + attr(l.id) + '">' +
      '<span class="dot" style="background:' + (LANE[l.id] || 'var(--line2)') + '"></span>' +
      esc(l.name) + '<span class="c">' + n + '</span></button>');
  });

  function sec(cls, name, arr, collapsible){
    if (!arr.length) return '';
    var body = arr.map(itemHTML).join('');
    if (!collapsible){
      return '<section class="grp"><div class="h ' + cls + '"><span class="t">' + name +
        '</span><span class="line"></span><span class="cnt">' + arr.length + '</span></div>' +
        '<div class="list">' + body + '</div></section>';
    }
    return '<section class="grp"><details class="more"><summary>' + name + ' · ' + arr.length +
      ' 条</summary><div class="list">' + body + '</div></details></section>';
  }

  var deg = d.degraded || [];
  $('#view-brief').innerHTML =
    '<div class="term" style="margin-top:14px">' +
      '<div class="bar"><span class="lbl">lane filter</span>' + chips.join('') + '</div>' +
    '</div>' +
    sec('h-top', '▲ 重磅', top) +
    sec('h-watch', '▸ 值得关注', watch) +
    sec('h-normal', '· 其他条目', normal, true) +
    sec('h-normal', '· 昨日已收录', rep, true) +
    (deg.length ? '<section class="grp"><div class="h h-normal"><span class="t">⚠ 本次降级源</span>' +
      '<span class="line"></span><span class="cnt">' + deg.length + '</span></div><div class="list">' +
      deg.map(function(x){
        return '<div class="it" style="--lane:var(--amber)"><div class="t1"><span class="mk">!</span>' +
          '<span>' + esc(x.id) + '<span class="en">' + esc(String(x.reason || '').slice(0, 170)) + '</span></span></div></div>';
      }).join('') + '</div></section>' : '') +
    (pick.length ? '' : '<div class="empty"><span class="b">∅</span>该筛选下没有条目</div>');

  $('#view-brief').querySelectorAll('.chip').forEach(function(b){
    b.onclick = function(){ laneFilter = b.dataset.lane; renderBrief(); window.scrollTo({top:0, behavior:'smooth'}); };
  });
}

/* ── 案例库 ───────────────────────────────────────── */
var CASES = null, caseType = 'all', caseQ = '';

function renderCases(){
  var box = $('#view-cases');
  if (CASES == null){
    box.innerHTML = '<div class="empty"><span class="b">…</span>正在读取 data/cases.json</div>';
    return;
  }
  var all = CASES.cases || [];
  var types = (CASES.types || []).filter(function(t){ return t; });
  var keyOf = function(c){ return c.type || ''; };
  var nNone = all.filter(function(c){ return !c.type; }).length;
  var list = all.filter(function(c){ return caseType === 'all' || keyOf(c) === caseType; });
  if (caseQ){
    var q = caseQ.toLowerCase();
    list = list.filter(function(c){
      return ((c.title || '') + ' ' + (c.titleEn || '') + ' ' + (c.summary || '') + ' ' + (c.type || ''))
        .toLowerCase().indexOf(q) >= 0;
    });
  }
  var chips = ['<button class="chip' + (caseType === 'all' ? ' on' : '') +
    '" data-type="all">全部<span class="c">' + all.length + '</span></button>'];
  types.sort(function(a, b){
    var ca = all.filter(function(c){ return c.type === a; }).length;
    var cb = all.filter(function(c){ return c.type === b; }).length;
    return cb - ca;                       // 条目多的排前面，更常用的先被点到
  });
  types.forEach(function(t){
    var n = all.filter(function(c){ return c.type === t; }).length;
    chips.push('<button class="chip' + (caseType === t ? ' on' : '') + '" data-type="' + attr(t) + '">' +
      esc(t) + '<span class="c">' + n + '</span></button>');
  });
  if (nNone){
    chips.push('<button class="chip' + (caseType === '' ? ' on' : '') +
      '" data-type="">未分类<span class="c">' + nNone + '</span></button>');
  }

  box.innerHTML =
    '<div class="term" style="margin-top:14px">' +
      '<div class="bar"><span class="lbl">grep</span>' +
        '<input class="search" id="q" placeholder="搜标题 / 摘要 / 分类…" value="' + attr(caseQ) + '">' +
        '<span class="lbl" style="margin-left:auto">' + list.length + ' / ' + all.length + '</span></div>' +
      '<div class="bar" style="border-bottom:0"><span class="lbl">type</span>' + chips.join('') + '</div>' +
    '</div>' +
    (list.length
      ? '<div class="cases">' + list.map(function(c){
          return '<article class="case">' +
            '<div class="ct"><a href="' + attr(c.url) + '" target="_blank" rel="noopener noreferrer">' +
              esc(c.title) + '</a></div>' +
            (c.titleEn ? '<div class="cen">' + esc(c.titleEn) + '</div>' : '') +
            (c.summary ? '<div class="cs">' + esc(c.summary) + '</div>' : '') +
            '<div class="cf">' +
              '<span class="ty' + (c.type ? '' : ' none') + '">' + esc(c.type || '未分类') + '</span>' +
              (c.topic && c.topic !== c.type
                ? '<span style="color:var(--fg3)">' + esc(c.topic) + '</span>' : '') +
              '<span>' + esc(c.block || host(c.url)) + '</span>' +
              '<span style="margin-left:auto;opacity:.7">' + esc(c.lastSeen || '') + '</span>' +
            '</div></article>';
        }).join('') + '</div>'
      : '<div class="empty"><span class="b">∅</span>' +
        (CASES.err ? '读取案例库失败：' + esc(CASES.err) + '<br>首次运行后生成' : '没有匹配的案例') + '</div>') +
    '<div class="ft"><span>案例库 · 每次运行自动累积（按链接去重）</span>' +
      '<span>共 ' + all.length + ' 条 · 更新于 ' + esc(CASES.updated || '—') + '</span></div>';

  box.querySelectorAll('.chip').forEach(function(b){
    b.onclick = function(){ caseType = b.dataset.type; renderCases(); };
  });
  var qi = box.querySelector('#q');
  if (qi){
    var tm = null;
    qi.oninput = function(){
      clearTimeout(tm);
      tm = setTimeout(function(){
        caseQ = qi.value.trim();
        renderCases();
        var n2 = document.querySelector('#q');
        if (n2){ n2.focus(); n2.setSelectionRange(n2.value.length, n2.value.length); }
      }, 280);
    };
  }
}

/* ── Tab ──────────────────────────────────────────── */
function showTab(name){
  var isBrief = name !== 'cases';
  $('#view-brief').classList.toggle('hide', !isBrief);
  $('#view-cases').classList.toggle('hide', isBrief);
  document.querySelectorAll('#tabs .tab').forEach(function(t){
    t.classList.toggle('on', (t.dataset.tab === 'cases') === !isBrief);
  });
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  window.scrollTo({top:0});
}

/* ── 启动 ─────────────────────────────────────────── */
function loadCases(){
  if (CASES !== null) return Promise.resolve();
  return fetch('data/cases.json?t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      CASES = j; CASES.max = CASES.max || 400;
      var n = $('#cn'); if (n) n.textContent = CASES.count || (CASES.cases || []).length;
    })
    .catch(function(e){ CASES = { cases: [], types: [], count: 0, updated: '', err: e.message }; })
    .then(function(){
      renderStat(DATA, (CASES.cases || []).length);
      renderCases();
    });
}

function main(){
  fetch('latest.json?t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      DATA = j;
      renderStat(DATA, null);
      $('#tabs').innerHTML =
        '<button class="tab on" data-tab="brief">简报<span class="n">' +
          ((DATA.counts && DATA.counts.total) || 0) + '</span></button>' +
        '<button class="tab" data-tab="cases">案例库<span class="n" id="cn">…</span></button>';
      $('#tabs').querySelectorAll('.tab').forEach(function(t){
        t.onclick = function(){
          showTab(t.dataset.tab);
          if (t.dataset.tab === 'cases') loadCases();
        };
      });
      $('#ft-gen').textContent = 'generated_at ' + (DATA.generated_at || '—');
      renderBrief();
      if (location.hash === '#cases'){ showTab('cases'); loadCases(); }
      else loadCases();
    })
    .catch(function(e){
      $('#view-brief').innerHTML = '<div class="empty"><span class="b">✗</span>读取 latest.json 失败：' +
        esc(e.message) + '<br>产物尚未生成，或 Pages 仍在构建</div>';
    });
}
main();
</script>
</body>
</html>
